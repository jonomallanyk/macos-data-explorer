name: Build & test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test

      - name: Build app
        run: ./scripts/build-app.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Data-Explorer-app
          path: build/Data-Explorer.zip
          if-no-files-found: error
